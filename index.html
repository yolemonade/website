<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Film Emotion Landscape</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0c0a}
body{background:var(--bg);color:#f0ebe0;font-family:'Cormorant Garamond',Georgia,serif;height:100vh;overflow:hidden;position:relative}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 18% 28%,rgba(210,140,60,.06)0%,transparent 50%),radial-gradient(ellipse at 82% 72%,rgba(170,45,30,.06)0%,transparent 50%);pointer-events:none}
@keyframes fa{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,calc(-50% - 10px))}}
@keyframes fb{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,calc(-50% + 9px))}}
@keyframes fc{0%,100%{transform:translate(-50%,-50%)}33%{transform:translate(calc(-50% - 6px),calc(-50% - 5px))}66%{transform:translate(calc(-50% + 5px),calc(-50% + 6px))}}
#hdr{position:fixed;top:0;left:0;right:0;z-index:200;padding:16px 36px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(240,235,224,.07);background:rgba(13,12,10,.95);backdrop-filter:blur(6px)}
.hd-left .eyebrow{font-family:'Jost',sans-serif;font-size:10px;font-weight:300;letter-spacing:.26em;text-transform:uppercase;color:#6a6358;margin-bottom:3px}
.hd-left h1{font-size:18px;font-weight:300;letter-spacing:.05em}
.hd-right{font-family:'Jost',sans-serif;font-size:10px;font-weight:300;letter-spacing:.14em;color:#6a6358}
#canvas{position:fixed;inset:62px 0 0 0;z-index:10}
.kw{position:absolute;font-weight:300;line-height:1;white-space:nowrap;transform:translate(-50%,-50%);cursor:pointer;user-select:none;letter-spacing:-.02em;transition:opacity .45s ease, color .8s ease}
.kw:hover{filter:brightness(1.5)}
.kw.dimmed{opacity:.04;pointer-events:none}
#detail{position:fixed;inset:62px 0 0 0;z-index:30;opacity:0;pointer-events:none;transition:opacity .55s ease;overflow:hidden}
#detail.active{opacity:1;pointer-events:auto}
#det-bg{position:absolute;inset:0;background:transparent;transition:background .7s ease}
#det-kw{position:absolute;top:20px;left:26px;z-index:30}
#det-kw-name{font-family:'Jost',sans-serif;font-size:10px;font-weight:300;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.36);margin-bottom:3px}
#det-kw-desc{font-family:'Jost',sans-serif;font-size:10px;font-weight:300;letter-spacing:.1em;color:rgba(255,255,255,.28);line-height:1.4}
#det-back{position:absolute;top:18px;right:24px;z-index:40;background:rgba(8,8,8,.42);border:1px solid rgba(255,255,255,.24);color:rgba(255,255,255,.9);font-family:'Jost',sans-serif;font-size:10px;font-weight:400;letter-spacing:.15em;text-transform:uppercase;padding:10px 15px;border-radius:999px;cursor:pointer;transition:.25s;backdrop-filter:blur(12px)}
#det-back:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.6);transform:translateY(-1px)}

/* ── 3-TIER WORD CASCADE: clearly separated vertically ── */
#det-emotions{position:absolute;inset:0;z-index:8;pointer-events:none}
.bem-wrap{position:absolute!important;left:50%!important;transform:translate(-50%,-50%)}
/* Tier 1: sentiment label — upper area */
.bem-wrap:first-child{top:22%!important}
/* Tier 2: dominant emotion — center */
.bem-wrap:nth-child(2){top:52%!important}
/* Tier 3: secondary emotion — lower area */
.bem-wrap:nth-child(3){top:76%!important}
.bem{font-family:'Cormorant Garamond',serif;font-weight:500;line-height:.88;white-space:nowrap;letter-spacing:-.04em;text-align:center;text-shadow:0 14px 40px rgba(0,0,0,.62),0 0 28px rgba(0,0,0,.32);-webkit-text-stroke:.4px rgba(255,255,255,.14);opacity:.22;transition:opacity .7s ease,transform .7s cubic-bezier(.25,.46,.45,.94),filter .7s ease,text-shadow .7s ease}
.bem-wrap:first-child .bem{font-size:clamp(90px,15vw,220px)!important;letter-spacing:.01em}
.bem-wrap:nth-child(2) .bem{font-size:clamp(44px,7vw,95px)!important}
.bem-wrap:nth-child(3) .bem{font-size:clamp(26px,4vw,52px)!important}

/* ── SCATTERED COMMENTS ── */
#det-comments{position:absolute;inset:0;z-index:18;pointer-events:none;overflow:hidden}
.cmt-outer{position:absolute;transform-origin:center;will-change:transform}
.cmt-outer.layer-back{z-index:4;opacity:.32;filter:blur(.25px)}
.cmt-outer.layer-mid{z-index:9;opacity:.65}
.cmt-outer.layer-front{z-index:18;opacity:1}
.cmt-inner{max-width:260px;opacity:0;transform:translateY(12px)}
.cmt-text{font-family:'Cormorant Garamond',serif;font-size:clamp(12px,1.15vw,17px);font-style:italic;font-weight:300;color:rgba(240,235,224,.68);line-height:1.38;text-shadow:0 2px 10px rgba(0,0,0,.82)}
.layer-back .cmt-text{color:rgba(240,235,224,.42);font-size:clamp(10px,.9vw,13px)}
.layer-mid .cmt-text{color:rgba(248,244,235,.75);text-shadow:0 2px 12px rgba(0,0,0,.95)}
.layer-front .cmt-text{color:rgba(255,255,255,.96);font-size:clamp(15px,1.5vw,22px);font-weight:400;text-shadow:0 3px 14px rgba(0,0,0,1),0 0 3px rgba(0,0,0,1)}
.cmt-film{font-family:'Jost',sans-serif;font-size:7.5px;font-weight:300;letter-spacing:.14em;text-transform:uppercase;color:rgba(240,235,224,.32);margin-top:4px;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.layer-front .cmt-film{color:rgba(255,255,255,.6);font-weight:400}
.layer-mid .cmt-film{color:rgba(255,255,255,.4)}
.cmt-outer:nth-child(5n) .cmt-text{font-size:clamp(16px,1.6vw,23px);color:rgba(255,255,255,.9)}
.cmt-outer:nth-child(8n) .cmt-text{font-size:clamp(19px,2vw,28px);font-weight:400;color:rgba(255,255,255,.94)}

#det-stats{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;text-align:center;min-width:min(620px,76vw)}
.det-dots{display:flex;gap:18px;justify-content:center;margin-bottom:7px}
.det-dot-item{display:flex;align-items:center;gap:6px;font-family:'Jost',sans-serif;font-size:9px;font-weight:400;letter-spacing:.1em;color:rgba(255,255,255,.5)}
.det-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.det-dot-pct{color:rgba(255,255,255,.86)}
#det-insight{font-family:'Jost',sans-serif;font-size:10px;font-weight:300;letter-spacing:.08em;color:rgba(255,255,255,.5);line-height:1.45}
#controls{position:fixed;bottom:20px;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:0 30px;pointer-events:none;transition:opacity .4s}
#controls.hide{opacity:0;pointer-events:none}
#hint{font-family:'Jost',sans-serif;font-size:10px;font-weight:300;letter-spacing:.2em;color:rgba(240,235,224,.2)}
#legend{display:flex;gap:16px}
.leg{display:flex;align-items:center;gap:6px;font-family:'Jost',sans-serif;font-size:10px;font-weight:300;letter-spacing:.13em;color:rgba(240,235,224,.22)}
.leg-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
@media(max-width:760px){
  #hdr{padding:12px 16px 10px}.hd-right{display:none}
  #canvas{inset:56px 0 0 0}#detail{inset:56px 0 0 0}
  #det-kw{top:14px;left:14px}#det-kw-desc{display:none}
  #det-back{top:12px;right:12px;padding:9px 12px;font-size:9px}
  .bem-wrap:first-child{top:18%!important}
  .bem-wrap:nth-child(2){top:50%!important}
  .bem-wrap:nth-child(3){top:76%!important}
  .bem-wrap:first-child .bem{font-size:clamp(68px,20vw,110px)!important}
  .bem-wrap:nth-child(2) .bem{font-size:clamp(34px,9vw,58px)!important}
  .bem-wrap:nth-child(3) .bem{font-size:clamp(20px,5.5vw,36px)!important}
  .cmt-inner{max-width:44vw}.cmt-text{font-size:11px!important}
  #det-stats{bottom:10px;min-width:92vw}.det-dots{gap:9px;flex-wrap:wrap}#det-insight{display:none}
}
</style>
</head>
<body>
<div id="hdr">
  <div class="hd-left">
    <div class="eyebrow">AI Film Sentiment Analysis · 2022–2026</div>
    <h1>Audience Emotion Landscape</h1>
  </div>
  <div class="hd-right">8,732 comments · 9 films · 4 NLP models</div>
</div>
<div id="canvas"></div>

  <div id="det-stats">
    <div class="det-dots" id="det-dots"></div>
    <div id="det-insight"></div>
  </div>
  <button id="det-back" type="button" onclick="goBack()">← 전체 감정으로</button>
</div>
<div id="controls">
  <div id="hint">Click a theme to explore →</div>
  <div id="legend">
    <div class="leg"><div class="leg-dot" style="background:#d4a850"></div>Positive</div>
    <div class="leg"><div class="leg-dot" style="background:#8a8478"></div>Neutral</div>
    <div class="leg"><div class="leg-dot" style="background:#c04030"></div>Negative</div>
  </div>
</div>

  {x:7,y:45,r:3,s:.96},{x:21,y:44,r:-2,s:1.12},{x:34,y:43,r:2,s:1.26},{x:46,y:45,r:-3,s:1.42},{x:58,y:42,r:2,s:1.34},{x:70,y:46,r:-1,s:1.18},{x:84,y:44,r:3,s:.98},

let view='overview', activeKw=null, tmr=null;
const canvas=document.getElementById('canvas');
const detail=document.getElementById('detail');
const detBg=document.getElementById('det-bg');
const controls=document.getElementById('controls');

function init(){
  KW.forEach(kw=>{
    const el=document.createElement('div');
    el.className='kw';el.id='kw-'+kw.id;
    el.textContent=kw.label;
    el.style.cssText=`left:${kw.x}%;top:${kw.y}%;font-size:${kw.fs}px;color:rgba(240,235,224,0.52);animation:${kw.fa} ${kw.fd}s ease-in-out infinite ${kw.fdel}s;`;
    el.addEventListener('click',()=>selectKw(kw));
    canvas.appendChild(el);
  });
}

function selectKw(kw){
  if(view!=='overview')return;
  view='keyword';activeKw=kw;
  document.querySelectorAll('.kw').forEach(w=>{w.style.animation='none';w.classList.add('dimmed')});

  document.getElementById('det-kw-name').textContent=kw.label;
  document.getElementById('det-kw-desc').textContent=kw.desc;
  setTimeout(()=>detBg.style.background=BG[kw.dom],50);
  detail.classList.add('active');
  controls.classList.add('hide');

  /* Cascade: sentiment label → emotion 1 → emotion 2 */
  const words=[SENT_LABEL[kw.dom],...kw.tier1];
  const colors=[SBC[kw.dom],...kw.tier1.map(n=>EC[n]||'#f0ebe0')];
  const iOps=[0.90,0.80,0.65];
  const sOps=[0.42,0.36,0.27];

  const ec=document.getElementById('det-emotions');ec.innerHTML='';
  words.forEach((name,i)=>{
    const wrap=document.createElement('div');wrap.className='bem-wrap';
    const el=document.createElement('div');el.className='bem';
    el.textContent=name;
    el.style.color=colors[i];
    el.style.opacity='0';
    el.style.transform='translateY(22px) scale(.988)';
    wrap.appendChild(el);ec.appendChild(wrap);
    setTimeout(()=>{
      el.style.transition='opacity .7s ease,transform .7s cubic-bezier(.25,.46,.45,.94),filter .7s ease,text-shadow .7s ease';
      el.style.opacity=iOps[i];
      el.style.transform='translateY(0) scale(1)';
      el.style.textShadow='0 18px 50px rgba(0,0,0,.72), 0 0 22px rgba(255,255,255,.08)';
    },320+i*200);
    setTimeout(()=>{
      el.style.opacity=sOps[i];
      el.style.filter='saturate(.9) blur(.1px)';
      el.style.textShadow='0 14px 36px rgba(0,0,0,.6)';
    },1800+i*120);
  });

  /* All SC positions — fill the entire screen */
  const cc=document.getElementById('det-comments');cc.innerHTML='';
  const shuffled=[...kw.comments].sort(()=>Math.random()-.5);
  SC.forEach((pos,i)=>{
    const c=shuffled[i%shuffled.length];
    const outer=document.createElement('div');
    const layer=i%7===0||i%7===3?'front':(i%3===0?'mid':'back');
    outer.className='cmt-outer layer-'+layer;
    outer.style.cssText=`left:${pos.x}%;top:${pos.y}%;transform:rotate(${pos.r}deg) scale(${pos.s||1});`;
    const inner=document.createElement('div');inner.className='cmt-inner';
    inner.style.transition=`opacity .45s ease ${.2+(i%11)*.045}s, transform .45s ease ${.2+(i%11)*.045}s`;
    inner.innerHTML=`<div class="cmt-text">"${c.t}"</div><div class="cmt-film">— ${c.f}</div>`;
    outer.appendChild(inner);cc.appendChild(outer);
    requestAnimationFrame(()=>setTimeout(()=>{
      inner.style.opacity='1';inner.style.transform='translateY(0)';
    },2000+60+i*18));
  });

  /* Stats */
  const dc=document.getElementById('det-dots');dc.innerHTML='';
  [{l:'Positive',v:kw.pos,c:'#d4a850'},{l:'Neutral',v:kw.neu,c:'#8a8478'},{l:'Negative',v:kw.neg,c:'#c04030'}]
  .forEach(s=>{
    const it=document.createElement('div');it.className='det-dot-item';
    it.innerHTML=`<div class="det-dot" style="background:${s.c}"></div><span>${s.l}</span><span class="det-dot-pct">${s.v.toFixed(0)}%</span>`;
    dc.appendChild(it);
  });
  document.getElementById('det-insight').textContent=kw.insight;
}

function goBack(){
  if(view!=='keyword')return;
  const kw=activeKw;
  view='overview';activeKw=null;
  detBg.style.background='transparent';
  detail.classList.remove('active');
  controls.classList.remove('hide');
  if(tmr)clearTimeout(tmr);
  tmr=setTimeout(()=>{
    document.querySelectorAll('.kw').forEach(w=>{
      w.classList.remove('dimmed');
      const k=KW.find(d=>'kw-'+d.id===w.id);
      if(k)w.style.animation=`${k.fa} ${k.fd}s ease-in-out infinite ${k.fdel}s`;
    });
    const kwEl=document.getElementById('kw-'+kw.id);
    if(kwEl)setTimeout(()=>kwEl.style.color=SC2[kw.dom],200);
    tmr=null;
  },420);
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')goBack()});
init();
</script>
